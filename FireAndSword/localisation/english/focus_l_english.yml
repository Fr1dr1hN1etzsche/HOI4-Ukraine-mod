l_english:
UKR_normalysation: "Stabilization"
UKR_normalysation_desc: Following a period of intense upheaval, a sweeping stabilization is taking place across the Ukrainian SSR. The state is successfully consolidating its administrative control, restoring order to the local economy, and standardizing social life. Chaos is gradually giving way to systemic institutional balance"
UKR_socialism_path: "Socialism Path"
UKR_socialism_path_desc: "By continuing the path of socialism, the Ukrainian SSR has achieved a comprehensive stabilization of all spheres of life. The chaos of the past is gone, replaced by a planned economy, firm administrative order, and social harmony. Under the banner of Marx and Lenin, the republic enters a new era of steady and uninterrupted development"
UKR_decrease_in_autonomy: "Decreasing Autonomy"
UKR_decrease_in_autonomy_desc: "For too long, Ukraine has been shackled by foreign directives and the suffocating grip of the communist regime. The time has come to reclaim our destiny. We reject the false promises of Marxism, cast off the authority of the Center, and stand ready to defend our sovereignty. Today, we rise as a free, independent nation!"